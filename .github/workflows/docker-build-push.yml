name: Build and Deploy Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub repository ka code checkout karega
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Docker Hub mein login karega
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Docker image build karega aur Docker Hub par push karega
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ankitdehariya19/evalyou-backend:latest

      # 4. EC2 par SSH karke latest Docker image deploy karega
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ankitdehariya19/evalyou-backend:latest

            docker stop evalyou-backend || true
            docker rm evalyou-backend || true

            docker run -d \
              --name evalyou-backend \
              --restart unless-stopped \
              --env-file ~/evalyou/.env \
              -p 8000:8000 \
              ankitdehariya19/evalyou-backend:latest